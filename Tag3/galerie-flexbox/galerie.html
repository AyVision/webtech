<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="galerie.css">
</head>
<body>
    <h1>Green</h1>
    
    <!--
      Die Galerie ist die Leine (Flex-Container).
      Jede figure ist ein Bild an der Leine (Flex-Item).

      tabindex="0" macht die Bilder mit der Tastatur erreichbar.
      So funktioniert der Zoom auch ohne Maus.

      Eigene Bilder: in den Ordner images/ legen und
      src + alt anpassen. Das Format ist egal – object-fit
      sorgt dafür, dass jedes Bild den Rahmen füllt.
    -->
    <div class="galerie">

      <figure class="bild" tabindex="0">
        <img src="images/abfalleimer.png" >
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/fahrrad.png" >
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/flasche.png" >
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/fliegenklatscher.png" >
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/geld.png">
      </figure>

    <figure class="bild" tabindex="0">
        <img src="images/karten.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/kerze.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/roller.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/rucksack.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/schuhe.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/seife.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/sticker.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/strassenkasten.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/strassenszene.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/vase.png">
      </figure>

      <figure class="bild" tabindex="0">
        <img src="images/vaseline.png" >
      </figure>

    </div>
    
</body>
</html>
