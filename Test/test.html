<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ein Satz wartet</title>
  <!-- Verknüpft die CSS-Datei -->
  <link rel="stylesheet" href="styletest.css">
</head>
<body>
  <h1>Hallo</h1>
  <!-- Dieser Satz ist am Anfang versteckt (display: none im CSS) -->
  <p id="satz">Hier steht dein Satz.</p>
  <!-- onclick: Beim Klick wird die Funktion zeigen() ausgeführt -->
  <button onclick="zeigen()">Klick mich</button>
  <!-- JavaScript ganz unten, damit alle Elemente schon geladen sind -->
  <script src="test.js"></script>
</body>
</html>
